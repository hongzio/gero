[tools]
go = "1.27.3"

[env]
# Pure-Go everywhere (modernc sqlite): the shim cross-compiles for linux with
# no C toolchain, and the darwin binary has no libc surprises under launchd.
CGO_ENABLED = "0"

# The image is named for the shim's bytes, so they leave out the commit
# (-buildvcs=false): a change elsewhere in psps builds no new image.
[tasks.shim]
description = "Cross-compile psps-shim for the isolation image (linux/arm64)"
run = "GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o internal/isolation/assets/psps-shim ./cmd/psps-shim"

[tasks.build]
description = "Build bin/psps with the linux shim embedded"
depends = ["shim"]
run = "go build -trimpath -o bin/psps ./cmd/psps"

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."
